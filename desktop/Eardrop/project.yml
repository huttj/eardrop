name: Eardrop
options:
  bundleIdPrefix: com.eardrop
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

targets:
  Eardrop:
    type: application
    platform: macOS
    sources:
      - Sources
    info:
      path: Info.plist
    entitlements:
      path: Eardrop.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eardrop.desktop
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Eardrop.entitlements
